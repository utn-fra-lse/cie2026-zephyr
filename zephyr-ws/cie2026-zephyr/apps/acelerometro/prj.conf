# ---- APIs que usa la aplicación ----
# Los drivers concretos (mpu6050, fxos8700, el I2C de cada SoC...) se
# habilitan solos porque su nodo del devicetree tiene status "okay".
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y

# ---- Logging, con punto flotante para mostrar las lecturas ----
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ---- Shell: explorar el hardware en vivo sin recompilar ----
#   uart:~$ device list
#   uart:~$ i2c scan <bus>
#   uart:~$ sensor get <sensor>
#   uart:~$ gpio get <puerto> <pin>
#   uart:~$ kernel thread list
CONFIG_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_SENSOR_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_KERNEL_SHELL=y
