# ---- APIs que usa la aplicación ----
# El driver concreto del sensor de temperatura interno (RP2040, STM32,
# ESP32, i.MX RT, Kinetis, MCX...) se habilita solo por el devicetree.
# Muchos de esos sensores se leen a través del ADC del propio chip.
CONFIG_SENSOR=y
CONFIG_ADC=y

# ---- Logging, con punto flotante para mostrar las lecturas ----
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y
